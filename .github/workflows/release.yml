# Releases EDGEchat: the plugin as a zip (tools/release/nexus-zip.mjs), a GitHub release, and the
# Nexus Mods page. The same workflow as EDGEmat's and REDnode's release.yml, so every EDGE tool
# releases the same way. Players get updates from the plugin marketplace (this repo's main branch);
# the zip is for installing without GitHub, and for the Nexus page.
#
#   Run workflow (Actions tab)                  builds the zip and keeps it as the run's artifact,
#                                               to install and test before a release
#   Run workflow, "Make a release" ticked       also tags the commit v<version> and makes the GitHub
#                                               release with the zip. Stops first if that tag exists
#                                               (raise "version" in .claude-plugin/plugin.json), if
#                                               it is not run on main, or if docs/changelog.md has no
#                                               section for the version (tools/release/notes.mjs)
#   ... and "Update Nexus Mods" ticked          also, after the GitHub release, uploads the zip to
#                                               the page as the main file's new version (the old one
#                                               archived, Mod Manager Download off: a Claude Code
#                                               plugin, not a game mod), adds its changelog and
#                                               pushes nexus/description.bbcode
#                                               (tools/nexus/nexus.mjs, copied from REDnode;
#                                               NEXUS_KEY). It checks the page first and stops before
#                                               building if nexus/nexus.json names no page yet, or if
#                                               the description changed on Nexus since the last pull
#                                               (node tools/nexus/nexus.mjs pull, merge, commit, run
#                                               again). If the upload fails after the GitHub release,
#                                               run tools/nexus/nexus.mjs release on the dev PC with
#                                               the release's zip: it skips what is already done.
#
# NEXUS_KEY is an Edgemodders organisation secret, shared with REDnode's, REDagent's and EDGEmat's
# workflows.
# Release gate: make a release only after every test of the builds since the last release has passed
# (docs/testing.md). Untested or failed means no release.
name: Release

on:
  workflow_dispatch:
    inputs:
      release:
        description: Make a release (tags this commit v<version>). Only after every test has passed
        type: boolean
        default: false
      nexus:
        description: Update Nexus Mods (with Make a release) - upload the zip, its changelog and the page's description
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    # Windows: the zip is written by Windows' own tar, as EDGEmat's is.
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # the tags: the Nexus check compares with the previous release's description

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: The plugin's version
        run: |
          version=$(node -p "require('./.claude-plugin/plugin.json').version")
          {
            echo "VERSION=${version}"
            echo "ZIP=${GITHUB_WORKSPACE}/dist/EDGEchat-${version}.zip"
          } >> "$GITHUB_ENV"

      - name: The version is not released yet
        if: inputs.release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${GITHUB_REF}" != "refs/heads/main" ]; then
            echo "::error::Make a release from main, not ${GITHUB_REF_NAME}."
            exit 1
          fi
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/v${VERSION}" --silent 2>/dev/null; then
            echo "::error::v${VERSION} is already released. Raise \"version\" in .claude-plugin/plugin.json."
            exit 1
          fi

      - name: Release notes from docs/changelog.md
        if: inputs.release
        run: |
          node tools/release/notes.mjs "${VERSION}" --out "${RUNNER_TEMP}/notes.md"
          node tools/release/notes.mjs "${VERSION}" --nexus --out "${RUNNER_TEMP}/nexus-notes.txt"

      - name: Nexus Mods can take this release
        if: inputs.release && inputs.nexus
        env:
          NEXUS_KEY: ${{ secrets.NEXUS_KEY }}
        run: |
          if [ -z "$(node -p "require('./nexus/nexus.json').page ?? ''")" ]; then
            echo "::error::nexus/nexus.json names no page yet. Create the page on Nexus, then run node tools/nexus/nexus.mjs pull with its number as \"page\" (nexus/README.md)."
            exit 1
          fi
          node tools/nexus/nexus.mjs check --version "${VERSION}"

      - name: The description's BBCode
        run: node tools/check-bbcode.mjs nexus/description.bbcode

      - name: Package
        id: package
        run: node tools/release/nexus-zip.mjs

      - uses: actions/upload-artifact@v7
        with:
          name: EDGEchat-build
          path: dist/EDGEchat-*.zip
          if-no-files-found: error

      - name: GitHub release
        id: github
        if: ${{ inputs.release && !cancelled() && steps.package.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${VERSION}" "${ZIP}" --target "${GITHUB_SHA}" --title "EDGEchat ${VERSION}" --notes-file "${RUNNER_TEMP}/notes.md"

      - name: Nexus Mods
        if: ${{ inputs.release && inputs.nexus && !cancelled() && steps.github.outcome == 'success' }}
        env:
          NEXUS_KEY: ${{ secrets.NEXUS_KEY }}
        run: node tools/nexus/nexus.mjs release --version "${VERSION}" --zip "${ZIP}" --notes "${RUNNER_TEMP}/nexus-notes.txt"
