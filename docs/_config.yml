# GitHub Pages (Jekyll) settings for the docs site.
# Every markdown page in docs/ renders with the HUD layout in _layouts/default.html.
# Built and deployed by .github/workflows/pages.yml.

title: EDGEplugin
url: https://edgemodders.github.io
baseurl: /EDGEplugin
repo: https://github.com/Edgemodders/EDGEplugin

markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge

defaults:
  - scope:
      path: ""
    values:
      layout: default

# Status bar links, in order.
nav:
  - title: Docs
    url: /
  - title: Design
    url: /design.html
  - title: Dev setup
    url: /dev-setup.html
  - title: Tests
    url: /testing.html
  - title: EDGEkit
    url: https://edgemodders.github.io/EDGEkit/
